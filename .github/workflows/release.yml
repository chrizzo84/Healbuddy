name: Release

# Runs when a version tag is pushed, e.g.:  git tag v0.2.0 && git push origin v0.2.0
# Builds Healbuddy-<tag>.zip, creates a GitHub release and - once the
# CurseForge project ID is in the TOC and the CF_API_KEY secret is set -
# uploads the file to CurseForge.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
